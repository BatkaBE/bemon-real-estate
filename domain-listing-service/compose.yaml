services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: listing_db
      POSTGRES_USER: listing_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for the standalone listing database}
    ports:
      - "127.0.0.1:${BEMON_LISTING_DB_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listing_user -d listing_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - listing-postgres-data:/var/lib/postgresql/data
volumes:
  listing-postgres-data:
