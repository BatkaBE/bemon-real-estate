openapi: 3.1.0
info:
  title: GerHub Listing engagement and featured placements
  version: 1.0.0
  description: Supplemental Listing contract. Identity is always the verified access-token subject.
servers: [{url: 'http://localhost:8080/v1'}]
security: [{bearer: []}]
paths:
  /users/me/favorites:
    get:
      operationId: listMyFavorites
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: 'Up to20 caller-saved public properties, pageSize and nullable nextCursor. Drafts/withdrawn properties are omitted.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /users/me/favorites/{propertyId}:
    parameters: [{$ref: '#/components/parameters/PropertyId'}]
    get:
      operationId: isMyFavorite
      responses:
        '200': {$ref: '#/components/responses/Saved'}
    put:
      operationId: saveMyFavorite
      summary: Idempotently save an ACTIVE property for this caller
      responses:
        '200': {$ref: '#/components/responses/Saved'}
        '404': {description: Property is not ACTIVE or does not exist}
    delete:
      operationId: removeMyFavorite
      responses:
        '200': {$ref: '#/components/responses/Saved'}
  /properties/{propertyId}/inquiries:
    parameters: [{$ref: '#/components/parameters/PropertyId'}]
    post:
      operationId: createMyInquiry
      summary: Contact the ACTIVE property's owning agent; sender contact comes from Identity
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200':
          description: Created inquiry or identical retry result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Inquiry'}
        '400': {description: Invalid message or attempt to contact yourself}
        '404': {description: Property unavailable}
        '409': {description: Key reused with another caller, property or message}
  /users/me/inquiries:
    get:
      operationId: listMyInquiries
      summary: Caller-owned buyer conversations or agent inbox; other participants are inaccessible
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200':
          description: Up to20 conversations and nullable nextCursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Inquiry'}}
                  nextCursor: {type: [string, 'null']}
  /inquiries/{inquiryId}:
    parameters:
      - {in: path, name: inquiryId, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: replyToMyInquiry
      summary: Only the owning ROLE_AGENT may reply or change status
      parameters:
        - {in: header, name: If-Match, required: true, schema: {type: string, pattern: '^"[0-9]{1,18}"$'}, description: Quoted current inquiry version}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reply]
              properties:
                status: {type: string, enum: [OPEN, CONTACTED, CLOSED]}
                reply: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Updated conversation, version increments once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Inquiry'}
        '403': {description: Agent ownership required}
        '404': {description: Inquiry unavailable}
        '412': {description: A later version already exists}
  /properties/featured:
    get:
      operationId: listPublicFeaturedPlacements
      security: []
      responses:
        '200': {description: 'items contains at most6 ACTIVE MNT properties with unexpired, unrevoked paid grants'}
  /properties/{propertyId}/featured:
    parameters: [{$ref: '#/components/parameters/PropertyId'}]
    get:
      operationId: getPublicFeaturedState
      security: []
      responses:
        '200':
          description: Current publication state and grant expiry checked on every read
          content:
            application/json:
              schema:
                type: object
                required: [featured]
                properties:
                  featured: {type: boolean}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT, description: 'Access-token scope, issuer, web/mobile audience and current account epoch required; ID tokens rejected'}
  parameters:
    PropertyId: {in: path, name: propertyId, required: true, schema: {type: string, format: uuid}}
    Cursor: {in: query, name: cursor, schema: {type: string}, description: Opaque keyset cursor returned by this collection}
  responses:
    Unauthorized: {description: Verified application access token required}
    Saved:
      description: Caller-owned relationship state
      content:
        application/json:
          schema:
            type: object
            required: [saved]
            properties:
              saved: {type: boolean}
  schemas:
    Inquiry:
      type: object
      required: [id, propertyId, buyerId, agentId, message, reply, status, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        propertyId: {type: string, format: uuid}
        buyerId: {type: string, format: uuid, readOnly: true}
        agentId: {type: string, format: uuid, readOnly: true}
        buyerName: {type: string, readOnly: true}
        buyerEmail: {type: string, format: email, readOnly: true}
        buyerPhone: {type: string, readOnly: true}
        propertyTitle: {type: string, description: Present in collection reads}
        message: {type: string, maxLength: 2000}
        reply: {type: string, maxLength: 2000}
        status: {type: string, enum: [OPEN, CONTACTED, CLOSED]}
        version: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
