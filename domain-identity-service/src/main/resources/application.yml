server:
  port: 9000
spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}
    username: ${DB_USERNAME:identity_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  oauth:
    issuer: ${IDENTITY_ISSUER_URI:http://localhost:9000}
    web-client-id: ${OAUTH_WEB_CLIENT_ID:domain-web}
    web-client-secret: ${OAUTH_WEB_CLIENT_SECRET}
    web-redirect-uri: ${OAUTH_WEB_REDIRECT_URI:http://localhost:3000/api/auth/callback/domain}
