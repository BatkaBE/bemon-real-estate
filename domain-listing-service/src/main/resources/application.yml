spring:
  application:
    name: listing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:listing_db}
    username: ${DB_USERNAME:listing_user}
    password: ${DB_PASSWORD:listing_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDENTITY_ISSUER_URI:http://localhost:9000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
app:
  media:
    bucket: ${MEDIA_S3_BUCKET:domain-listing-media-dev}
    region: ${AWS_REGION:ap-southeast-2}
    presign-duration: ${MEDIA_PRESIGN_DURATION:PT10M}
